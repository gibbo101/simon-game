<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23009FE3'/><circle cx='50' cy='50' r='30' fill='%23EFB920'/></svg>">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h1>Simon</h1>
        <h2>Memory game</h2>
    </div>

    <div class="layout">
        <div class="game-panel">
            <div class="board">
                <div data-listener="false" class="circle circle1" id="button1" role="button" tabindex="0"
                    aria-label="Blue button"></div>
                <div data-listener="false" class="circle circle2" id="button2" role="button" tabindex="0"
                    aria-label="Grey button"></div>
                <div data-listener="false" class="circle circle3" id="button3" role="button" tabindex="0"
                    aria-label="Yellow button"></div>
                <div data-listener="false" class="circle circle4" id="button4" role="button" tabindex="0"
                    aria-label="Teal button"></div>
                <div class="scorebox" id="score" aria-live="polite">0</div>
            </div>
            <div class="controls">
                <div class="initials-field">
                    <label for="player-initials" class="initials-label">Name</label>
                    <input type="text" id="player-initials" class="initials-input" placeholder="AAA" maxlength="3"
                        autocapitalize="characters" autocomplete="off" spellcheck="false"
                        aria-describedby="initials-hint">
                    <span id="initials-hint" class="initials-hint">3 letters</span>
                </div>
                <button class="button" onclick="newGame()">New game</button>
            </div>
        </div>

        <aside class="scoreboard" aria-label="Leaderboard">
            <h3>Leaderboard</h3>
            <ol id="scoreboard-list" class="scoreboard-list" aria-live="polite">
                <li class="scoreboard-status">Loading…</li>
            </ol>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="scripts/game.js"></script>
    <script>
        // Load the board and the remembered initials as soon as the page loads.
        // Guarded so the Jest/jsdom environment (where these live in a module,
        // not globals) doesn't throw while parsing index.html.
        if (typeof initPage === "function") {
            initPage();
        }
    </script>
</body>

</html>
